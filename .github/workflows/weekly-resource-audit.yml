name: Weekly Resource Audit

on:
  schedule:
    - cron: '7 0 * * 1'
      timezone: 'America/Vancouver'
  workflow_dispatch:
    inputs:
      deep_check:
        description: 'Allow up to 2 MiB per source response (normal limit: 512 KiB)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: weekly-resource-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Restore prior source fingerprints
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: npx tsx scripts/resource-audit/restore-state.ts
      - name: Audit all resources, sources, search, posters and course snapshots
        id: audit
        continue-on-error: true
        env:
          DEEP_CHECK: ${{ inputs.deep_check || false }}
        run: |
          if [ "$DEEP_CHECK" = true ]; then
            npm run audit:weekly -- --deep-check
          else
            npm run audit:weekly
          fi
      - name: Unit tests
        id: tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm test
      - name: Lint
        id: lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run lint
      - name: Typecheck and production build
        id: build
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run build
      - name: Complete report and Job Summary
        id: report
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: npx tsx scripts/resource-audit/finalize.ts
      - name: Preserve audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-audit
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve bounded public source state
        if: ${{ always() && steps.audit.outputs.state_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: resource-audit-source-state
          path: .resource-audit/state.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
      - name: Create or update one maintenance issue
        id: issue
        if: ${{ always() && steps.install.outcome == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/resource-audit/publish-issue.ts
      - name: Report setup or reporting failure
        if: ${{ always() && (steps.install.outcome != 'success' || steps.report.outcome != 'success' || steps.issue.outcome == 'failure') }}
        run: |
          printf '%s\n' '## Audit needs attention' 'A setup, audit, quality gate or issue-reporting step failed. Inspect step logs and any retained audit artifact. No facts or verification timestamps were published.' >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce error severity
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          REPORT_RESULT: ${{ steps.report.outcome }}
          ISSUE_RESULT: ${{ steps.issue.outcome }}
        run: |
          test "$INSTALL_RESULT" = success
          test "$REPORT_RESULT" = success
          test "$ISSUE_RESULT" != failure

# Public-repository schedules may be disabled after 60 inactive days.
# No keepalive commits, factual rewrites, verifiedAt updates, PRs or auto-merges.
